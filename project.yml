name: Syntholo
options:
  bundleIdPrefix: com.syntholo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
configs:
  Debug: debug
  Release: release
# Firebase 12.14.0 stays compatible with the Xcode 16.2/Swift 6.0 iOS 17 CI job.
# Firebase 12.15.0 and later declare Swift tools 6.1.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    version: 12.14.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    version: 9.2.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Syntholo:
    type: application
    platform: iOS
    sources:
      - path: Syntholo
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAnalytics
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syntholo.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: Syntholo/Resources/Syntholo.entitlements
        INFOPLIST_FILE: Syntholo/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - SyntholoTests
        - SyntholoUITests
  SyntholoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SyntholoTests
        optional: true
      - path: tests/fixtures/content
        buildPhase: resources
      - path: content/schema/curriculum-v1.digest-vectors.json
        buildPhase: resources
    dependencies:
      - target: Syntholo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syntholo.ios.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
  SyntholoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SyntholoUITests
        optional: true
    dependencies:
      - target: Syntholo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syntholo.ios.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
