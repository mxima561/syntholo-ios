name: Syntholo
options:
  bundleIdPrefix: com.syntholo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Syntholo:
    type: application
    platform: iOS
    sources:
      - path: Syntholo
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syntholo.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_SYNTHOLO_ENV: $(SYNTHOLO_ENV)
        INFOPLIST_KEY_CFBundleDisplayName: Syntholo
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - SyntholoTests
        - SyntholoUITests
  SyntholoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SyntholoTests
        optional: true
    dependencies:
      - target: Syntholo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syntholo.ios.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
  SyntholoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SyntholoUITests
        optional: true
    dependencies:
      - target: Syntholo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syntholo.ios.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
