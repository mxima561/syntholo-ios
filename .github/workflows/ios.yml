name: iOS

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew bundle
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Test
        run: ./scripts/test.sh

  test-ios-17:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew bundle
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Test on iOS 17.5
        env:
          SYNTHOLO_DESTINATION: platform=iOS Simulator,name=iPhone 15 Pro,OS=17.5
        run: ./scripts/test.sh
