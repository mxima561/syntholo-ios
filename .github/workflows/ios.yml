name: iOS

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned repository tools
        run: |
          brew bundle
          ./scripts/install_gitleaks.sh
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.12+8.0.LTS"
      - name: Install pinned Firebase tooling
        run: |
          npm ci
          test "$(./node_modules/.bin/firebase --version)" = "15.28.1"
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Test
        run: ./scripts/test.sh

  test-ios-17:
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned repository tools
        run: |
          brew bundle
          ./scripts/install_gitleaks.sh
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.12+8.0.LTS"
      - name: Install pinned Firebase tooling
        run: |
          npm ci
          test "$(./node_modules/.bin/firebase --version)" = "15.28.1"
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Test on iOS 17.5
        env:
          SYNTHOLO_DESTINATION: platform=iOS Simulator,name=iPhone 15 Pro,OS=17.5
        run: ./scripts/test.sh
